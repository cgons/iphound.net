version: "3"

vars:
  IMAGE: iphound-webui
  REMOTE_HOST: rnvps
  REMOTE_COMPOSE: /home/ops/configs/iphound/docker-compose.yaml
  GIT_REF: master
  TAG:
    sh: echo "$(echo '{{.GIT_REF}}' | tr '/' '-')-$(git rev-parse --short '{{.GIT_REF}}')"

tasks:
  deps:list:
    desc: Report dependencies with newer versions available
    cmds:
      - ncu

  deps:update:
    desc: Upgrade dependencies to the latest minor versions and install them
    cmds:
      - ncu -u --target minor
      - npm install

  build:docker-git:
    desc: Build and tag a Docker image from the committed tree at {{.GIT_REF}} (ignores the working directory)
    cmds:
      - git archive --format=tar '{{.GIT_REF}}' | docker build --platform linux/amd64 -t {{.IMAGE}}:{{.TAG}} -t {{.IMAGE}}:latest -
      - echo "Tagged {{.IMAGE}}:{{.TAG}} and {{.IMAGE}}:latest"

  deploy:sync:
    desc: Ship the image to the remote host
    cmds:
      - docker save {{.IMAGE}}:{{.TAG}} {{.IMAGE}}:latest | ssh {{.REMOTE_HOST}} -C 'docker load'

  deploy:reload:
    desc: Recreate the stack on the remote host
    cmds:
      - ssh -C {{.REMOTE_HOST}} 'docker compose -f {{.REMOTE_COMPOSE}} up --force-recreate -t 0 -d'

  deploy:
    desc: Build the image, ship it to the remote host, and reload the stack
    cmds:
      - task: build:docker-git
      - task: deploy:sync
      - task: deploy:reload
